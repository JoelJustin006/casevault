<!doctype html>
<html>

<head>
    <title>Server Error — CaseVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #070a12;
            color: #f1f5f9;
            font-family: system-ui, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .wrap {
            text-align: center;
            max-width: 520px;
            padding: 2rem;
        }

        .icon {
            font-size: 5rem;
            color: #f87171;
            filter: drop-shadow(0 0 30px rgba(248, 113, 113, .5));
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin: 1rem 0;
        }

        p {
            color: #8896b0;
            font-size: 1.02rem;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: .65rem 1.5rem;
            background: linear-gradient(180deg, #34d399, #10b981);
            color: #04170f;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="icon"><i class="bi bi-exclamation-octagon-fill"></i></div>
        <h1>Something Went Wrong</h1>
        <p>The server encountered an unexpected error. Your session is safe and no data has been lost.
            If this persists, contact your system administrator.</p>
        <a href="/">Return to Home</a>
    </div>
</body>

</html>
